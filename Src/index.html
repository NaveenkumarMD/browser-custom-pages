<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD</title>
    <link rel="icon" href="../Assets/icons/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./Components/Music/musicplayer.css" />
    <link rel="stylesheet" href="./Components/Weather/weather.css" />
    <link rel="stylesheet" href="./Components/Clock/clock.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="../Highcharts/highcharts.js"></script>
    <script src="../Highcharts/highcharts-more.js"></script>
    <script src="../Highcharts/exporting.js"></script>
    <script src="../Highcharts/export-data.js"></script>
    <script src="../Highcharts/accessibility.js"></script>
    <script src="../Cache/cookie.js" defer></script>
  </head>

  <body>
    <div class="main" id="main">
      <div class="stackoverflow-container" id="stackoverflow-container">
        <div class="stack-card" id="stack-card">
          <div id="reputations"></div>
          <div id="reputations-text">reputations</div>
        </div>
        <div id="badges">
          <div class="badges-count">
            <div><span id="gold"></span></div>
            <div><i class="fas fa-circle" style="color: gold"></i></div>
          </div>
          <div>
            <div><span id="silver"></span></div>
            <div><i class="fas fa-circle" style="color: silver"></i></div>
          </div>

          <div>
            <div><span id="bronze"></span></div>

            <div><i class="fas fa-circle" style="color: #cd7f32"></i></div>
          </div>
        </div>
      </div>
      <div class="news-container">
        <p id="streak-image"></p>
        <!-- <p><img class="gitstreak" align="center"
                    src="https://github-readme-streak-stats.herokuapp.com/?user=naveenkumarmd&theme=gruvbox_duo&date_format=M%20j%5B%2C%20Y%5D&background=312E2E80&ring=10C5FF&sideNums=DDDDDD&currStreakLabel=10C5FF&border=DDDDDD00&dates=DDDDDD&fire=0BAADD&sideLabels=DDDDDD&currStreakNum=16A6DD&stroke=C0C0C0"
                    alt="naveenkumarmd" /></p> -->
      </div>
      <div class="weather-container">
        <div class="flex space-between align-center">
          <div class="today-text">Today</div>
          <div class="weather-date" id="weather-date"></div>
        </div>
        <div class="flex space-around align-center temp-container">
          <div>
            <span class="temperature" id="_temp">30</span>
            <span class="metric">&deg; C</span>
          </div>

          <div>
            <img
              src="../Assets/icons/Weather/partly-cloudy.png"
              alt="weather"
            />
          </div>
        </div>
        <div class="location-text">
          <i class="fas fa-map-marker-alt" style="color: white"></i>
          <span id="_location"></span>
        </div>
      </div>
      <div class="music-player-container">
        <div class="music-container" id="music-container">
          <div class="navigation">
            <button class="action-btn" id="select-wallpaper">
              <i class="fas fa-folder"></i>
            </button>
            <input
              type="file"
              multiple
              id="songs-input"
              style="display: hidden; width: 0px; height: 0px"
            />
            <button class="action-btn" id="shuffle">
              <i class="fas fa-random"></i>
            </button>
          </div>
        </div>
      </div>

      <div id="player03" class="player horizontal">
        <div class="wrapper">
          <div class="info-wrapper">
            <img
              id="music-icon"
              src="https://cdn.pixabay.com/photo/2017/08/05/22/29/gorilla-2586193_1280.jpg"
              alt="LogoMusicImage"
            />

            <div class="info">
              <h1 id="music-title">Code<br />PodCast</h1>
              <!-- <p>Banda OneBitMusic</p> -->
            </div>
          </div>

          <div class="controls">
            <div class="prev music-control" id="music-prev">
              <svg
                width="30"
                height="30"
                viewBox="0 0 30 30"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M2.33917 13.7397L12.9664 7.38149C13.2293 7.22152 13.5303 7.13509 13.8381 7.13123C14.1458 7.12737 14.4489 7.20622 14.7157 7.35955C15.0053 7.52815 15.245 7.77036 15.4107 8.0616C15.5763 8.35284 15.6619 8.68272 15.6588 9.01775V13.4657L25.8274 7.3798C26.0903 7.21983 26.3914 7.13341 26.6991 7.12955C27.0068 7.12568 27.3099 7.20454 27.5768 7.35786C27.8663 7.52646 28.1061 7.76867 28.2717 8.05991C28.4373 8.35115 28.5229 8.68103 28.5198 9.01606V21.4512C28.5231 21.7863 28.4376 22.1163 28.2719 22.4077C28.1063 22.699 27.8664 22.9413 27.5768 23.1099C27.3099 23.2632 27.0068 23.3421 26.6991 23.3382C26.3914 23.3344 26.0903 23.2479 25.8274 23.088L15.6588 16.9993V21.4489C15.6625 21.7844 15.5771 22.1149 15.4114 22.4067C15.2458 22.6985 15.0057 22.9411 14.7157 23.1099C14.4489 23.2632 14.1458 23.3421 13.8381 23.3382C13.5303 23.3344 13.2293 23.2479 12.9664 23.088L2.33917 16.7298C2.08653 16.5715 1.87825 16.3516 1.73386 16.0908C1.58948 15.83 1.51373 15.5368 1.51373 15.2387C1.51373 14.9406 1.58948 14.6473 1.73386 14.3865C1.87825 14.1257 2.08653 13.9058 2.33917 13.7476V13.7397Z"
                  fill="#E1E1E6"
                />
              </svg>
            </div>
            <div class="play music-control" id="music-play">
              <img id="play-icon" src="../Assets/icons/play.svg" />
              <img
                id="pause-icon"
                style="display: none"
                src="../Assets/icons/pause.svg"
              />
            </div>
            <div class="next music-control" id="music-next">
              <svg
                width="29"
                height="30"
                viewBox="0 0 29 30"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g clip-path="url(#clip0_42_51)">
                  <path
                    d="M27.1426 13.7397L16.5154 7.38149C16.2525 7.22152 15.9514 7.13509 15.6437 7.13123C15.336 7.12737 15.0329 7.20622 14.766 7.35955C14.4765 7.52815 14.2368 7.77036 14.0711 8.0616C13.9055 8.35284 13.8199 8.68272 13.823 9.01775V13.4657L3.65435 7.3798C3.39144 7.21983 3.0904 7.13341 2.78268 7.12955C2.47495 7.12568 2.17183 7.20454 1.905 7.35786C1.61547 7.52646 1.37571 7.76867 1.21008 8.05991C1.04445 8.35115 0.958845 8.68103 0.961955 9.01606V21.4512C0.958745 21.7863 1.0443 22.1163 1.20994 22.4076C1.37558 22.699 1.61538 22.9413 1.905 23.1099C2.17183 23.2632 2.47495 23.3421 2.78268 23.3382C3.0904 23.3344 3.39144 23.2479 3.65435 23.088L13.823 16.9993V21.4489C13.8194 21.7844 13.9048 22.1149 14.0704 22.4066C14.2361 22.6984 14.4761 22.9411 14.766 23.1099C15.0329 23.2632 15.336 23.3421 15.6437 23.3382C15.9514 23.3344 16.2525 23.2479 16.5154 23.088L27.1426 16.7298C27.3953 16.5715 27.6035 16.3516 27.7479 16.0908C27.8923 15.83 27.968 15.5368 27.968 15.2387C27.968 14.9406 27.8923 14.6473 27.7479 14.3865C27.6035 14.1257 27.3953 13.9058 27.1426 13.7476V13.7397Z"
                    fill="#E1E1E6"
                  />
                </g>
                <defs>
                  <clipPath id="clip0_42_51">
                    <rect
                      width="28.8089"
                      height="28.8089"
                      fill="white"
                      transform="translate(0.0612183 0.828369)"
                    />
                  </clipPath>
                </defs>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="worked-container">
        <div class="abs-bottom" id="add-event">
          <img src="../Assets/icons/add.svg" alt="add" id="add-work-image" />
        </div>
        <div class="title-card">Tasks</div>
        <div class="card-container" id="task-container"></div>
      </div>
      <div class="top-bar">
        <div class="welcome-content">
          <div>Welcome <span id="username"></span>!</div>

          <div>Good <span id="daytime"></span></div>
        </div>

        <div class="timeanddate">
          <figure class="highcharts-figure">
            <div id="clock"></div>
          </figure>
        </div>
      </div>
      <div class="quote-container">
        <div id="random-quote"></div>
        <div id="author"></div>
      </div>
      <div class="search-center">
        <div class="search-box">
          <span class="selector-button">
            <div id="engine-selector">
              <img
                id="selectedEngine"
                src="../Assets/icons/google.svg"
                class="engine-logo"
              />
            </div>
            <div class="site-selector" id="engine-selector-list">
              <div id="googleclick">
                <img src="../Assets/icons/google.svg" class="engine-logo" />
              </div>
              <div id="duckclick">
                <img src="../Assets/icons/duckduckgo.svg" class="engine-logo" />
              </div>
              <div id="bingclick">
                <img src="../Assets/icons/bing.svg" class="engine-logo" />
              </div>
              <div id="youtubeclick">
                <img src="../Assets/icons/youtube.svg" class="engine-logo" />
              </div>
              <div id="instaclick">
                <img src="../Assets/icons/instagram.svg" class="engine-logo" />
              </div>
            </div>
          </span>

          <div class="search-input">
            <input type="text" placeholder="Search..." id="search-input" />
            <div
              class="search-recommendations"
              id="search-recommendations"
            ></div>
          </div>
          <div class="favourites-container">
            <div class="favourite"></div>
          </div>

          <img
            src="../Assets/icons/search.svg"
            class="search-icon"
            id="search-button"
            width="25px"
            height="25px"
            style="margin-right: 10px"
          />
        </div>
      </div>
      <div class="favourites-container" id="favourites">
        <div class="favourites" id="medium">
          <div class="icon">
            <img src="../Assets/icons/medium.svg" />
          </div>
          <div class="name">Medium</div>
        </div>
        <div class="favourites" id="github">
          <div class="icon">
            <img src="../Assets/icons/github.svg" />
          </div>
          <div class="name">Github</div>
        </div>
        <div class="favourites" id="spotify">
          <div class="icon">
            <img src="../Assets/icons/spotify.svg" />
          </div>
          <div class="name">Spotify</div>
        </div>
        <div class="favourites" id="linkedin">
          <div class="icon">
            <img src="../Assets/icons/linkedin.svg" />
          </div>
          <div class="name">LinkedIn</div>
        </div>
        <div class="favourites" id="portfolio">
          <div class="icon">
            <img src="../Assets/icons/portfolio.svg" />
          </div>
          <div class="name">Portfolio</div>
        </div>
        <div class="favourites" id="instagram">
          <div class="icon">
            <img src="../Assets/icons/instagram.svg" />
          </div>
          <div class="name">Instagram</div>
        </div>
        <div class="favourites" id="gmail">
          <div class="icon">
            <img src="../Assets/icons/gmail.svg" />
          </div>
          <div class="name">Gmail</div>
        </div>
      </div>
      <div id="extensions-list" style="display: none"></div>
    </div>
  </body>
  <script src="../dist/index.js" defer></script>
</html>
